pre-commit:
  parallel: true
  commands:
    cargo-fmt:
      run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
    cargo-clippy:
      run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
    prettier:
      run: npx prettier --check .
    eslint:
      run: npx eslint .
    tsc:
      run: npx tsc --noEmit
    migrations:
      run: bash scripts/check-migrations.sh
    # bindings regenerates src/api/bindings.ts while cargo-test's
    # bindings freshness test reads it — running them in parallel races.
    # Keep them sequential in one job; everything else stays parallel.
    rust-serial:
      run: bash scripts/check-bindings.sh && cargo test --manifest-path src-tauri/Cargo.toml
    vitest:
      run: npx vitest run
    # playwright's vite dev server starves and dies mid-suite while the
    # heavier linters run — serialize it after the parallel batch.
    playwright:
      priority: 1
      run: npx playwright test

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}
