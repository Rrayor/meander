name: Rust setup
description: Update the runner's rustup toolchain and restore the cargo cache
inputs:
  components:
    description: Extra rustup components to install (space-separated)
    required: false
    default: ""
  cache-target:
    description: Cache src-tauri/target (skip for space-hungry release builds)
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Rust toolchain (runner-provided rustup)
      shell: bash
      run: |
        rustup update stable
        if [ -n "${{ inputs.components }}" ]; then
          rustup component add ${{ inputs.components }}
        fi

    - uses: actions/cache@v4
      if: inputs.cache-target == 'true'
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          src-tauri/target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
        restore-keys: ${{ runner.os }}-cargo-

    - uses: actions/cache@v4
      if: inputs.cache-target == 'false'
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
        key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
        restore-keys: ${{ runner.os }}-cargo-
