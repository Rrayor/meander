name: Rust setup
description: Update the runner's rustup toolchain and restore the cargo cache
inputs:
  components:
    description: Extra rustup components to install (space-separated)
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Rust toolchain (runner-provided rustup)
      shell: bash
      run: |
        rustup update stable
        if [ -n "${{ inputs.components }}" ]; then
          rustup component add ${{ inputs.components }}
        fi

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: src-tauri
